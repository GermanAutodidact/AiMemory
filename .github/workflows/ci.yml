name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/opencode.test.mjs
      - run: node --test tests/opencode-v2.test.mjs
